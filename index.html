<!-- Checkout / Customer Information Modal -->
<div id="paymentModal"
     class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

    <div class="glass-card max-w-2xl w-full rounded-2xl overflow-hidden border border-amber-500/40 shadow-2xl flex flex-col max-h-[92vh]">

        <!-- Header -->
        <div class="p-4 bg-slate-900 flex justify-between items-center border-b border-slate-800">

            <div>
                <h3 class="font-bold text-lg text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice"></i>
                    إتمام الطلب والدفع
                </h3>

                <p class="text-[10px] text-slate-400 mt-1">
                    أدخل بيانات الاستلام ثم تابع للدفع بالفيزا / Mastercard
                </p>
            </div>

            <button onclick="closePaymentModal()"
                    class="text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

        </div>

        <!-- Body -->
        <div class="p-5 overflow-y-auto">

            <form id="checkoutForm"
                  onsubmit="submitCheckoutForm(event)"
                  class="space-y-4">

                <!-- Customer Name -->
                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1">
                        الاسم بالكامل *
                    </label>

                    <input type="text"
                           id="customerName"
                           required
                           autocomplete="name"
                           placeholder="اكتب اسم العميل بالكامل"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>

                <!-- Phone -->
                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1">
                        رقم الموبايل *
                    </label>

                    <input type="tel"
                           id="customerPhone"
                           required
                           autocomplete="tel"
                           inputmode="tel"
                           placeholder="01xxxxxxxxx"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>

                <!-- Governorate + City -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                    <div>
                        <label class="block text-xs text-slate-300 font-bold mb-1">
                            المحافظة *
                        </label>

                        <select id="customerGovernorate"
                                required
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">

                            <option value="">اختر المحافظة</option>
                            <option>القاهرة</option>
                            <option>الجيزة</option>
                            <option>الإسكندرية</option>
                            <option>القليوبية</option>
                            <option>المنوفية</option>
                            <option>الغربية</option>
                            <option>الدقهلية</option>
                            <option>البحيرة</option>
                            <option>كفر الشيخ</option>
                            <option>دمياط</option>
                            <option>الشرقية</option>
                            <option>بورسعيد</option>
                            <option>الإسماعيلية</option>
                            <option>السويس</option>
                            <option>شمال سيناء</option>
                            <option>جنوب سيناء</option>
                            <option>البحر الأحمر</option>
                            <option>مطروح</option>
                            <option>الفيوم</option>
                            <option>بني سويف</option>
                            <option>المنيا</option>
                            <option>أسيوط</option>
                            <option>سوهاج</option>
                            <option>قنا</option>
                            <option>الأقصر</option>
                            <option>أسوان</option>
                            <option>الوادي الجديد</option>

                        </select>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-300 font-bold mb-1">
                            المركز / المدينة *
                        </label>

                        <input type="text"
                               id="customerCity"
                               required
                               autocomplete="address-level2"
                               placeholder="مثال: أشمون"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>

                </div>

                <!-- Address -->
                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1">
                        العنوان بالتفصيل *
                    </label>

                    <textarea id="customerAddress"
                              required
                              rows="3"
                              autocomplete="street-address"
                              placeholder="اسم الشارع، رقم العقار، الدور، العلامة المميزة..."
                              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <!-- Delivery Method -->
                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-2">
                        طريقة الاستلام *
                    </label>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                        <label class="cursor-pointer">

                            <input type="radio"
                                   name="deliveryMethod"
                                   value="توصيل للعنوان"
                                   checked
                                   class="hidden peer">

                            <div class="p-4 rounded-xl bg-slate-900 border border-slate-700 peer-checked:border-amber-500 peer-checked:bg-amber-500/10 transition">

                                <div class="flex items-center gap-3">

                                    <i class="fa-solid fa-truck text-amber-400 text-xl"></i>

                                    <div>
                                        <div class="font-bold text-sm">
                                            توصيل للعنوان
                                        </div>

                                        <div class="text-[10px] text-slate-400">
                                            التوصيل حتى باب العميل
                                        </div>
                                    </div>

                                </div>

                            </div>

                        </label>

                        <label class="cursor-pointer">

                            <input type="radio"
                                   name="deliveryMethod"
                                   value="استلام من المصنع"
                                   class="hidden peer">

                            <div class="p-4 rounded-xl bg-slate-900 border border-slate-700 peer-checked:border-amber-500 peer-checked:bg-amber-500/10 transition">

                                <div class="flex items-center gap-3">

                                    <i class="fa-solid fa-industry text-amber-400 text-xl"></i>

                                    <div>
                                        <div class="font-bold text-sm">
                                            استلام من المصنع
                                        </div>

                                        <div class="text-[10px] text-slate-400">
                                            من مقر المتحدة للرتان والأثاث
                                        </div>
                                    </div>

                                </div>

                            </div>

                        </label>

                    </div>
                </div>

                <!-- Delivery Time -->
                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1">
                        الاستلام خلال كام يوم؟ *
                    </label>

                    <select id="deliveryTime"
                            required
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">

                        <option value="">اختر المدة</option>
                        <option value="1 - 3 أيام">1 - 3 أيام</option>
                        <option value="3 - 5 أيام">3 - 5 أيام</option>
                        <option value="5 - 7 أيام">5 - 7 أيام</option>
                        <option value="أكثر من 7 أيام">أكثر من 7 أيام</option>
                        <option value="حسب موعد الاتفاق مع المصنع">حسب موعد الاتفاق مع المصنع</option>

                    </select>
                </div>

                <!-- Notes -->
                <div>
                    <label class="block text-xs text-slate-300 font-bold mb-1">
                        ملاحظات إضافية
                    </label>

                    <textarea id="customerNotes"
                              rows="2"
                              placeholder="أي ملاحظات خاصة بالطلب أو التوصيل..."
                              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <!-- Order Summary -->
                <div class="bg-slate-950 rounded-xl p-4 border border-slate-800">

                    <div class="flex justify-between items-center mb-3">

                        <span class="text-sm text-slate-300">
                            عدد المنتجات
                        </span>

                        <span id="checkoutItemsCount"
                              class="font-bold text-white">
                            0
                        </span>

                    </div>

                    <div class="flex justify-between items-center border-t border-slate-800 pt-3">

                        <span class="font-bold">
                            إجمالي الطلب
                        </span>

                        <span id="paymentTotal"
                              class="text-xl font-extrabold text-amber-400">
                            0 ج.م
                        </span>

                    </div>

                </div>

                <!-- Security Notice -->
                <div class="rounded-xl bg-emerald-950/30 border border-emerald-500/20 p-3">

                    <div class="flex gap-2">

                        <i class="fa-solid fa-shield-halved text-emerald-400 mt-0.5"></i>

                        <p class="text-[10px] text-emerald-200 leading-relaxed">
                            بيانات البطاقة البنكية لا يتم تخزينها على موقع المتحدة.
                            سيتم تحويلك إلى بوابة الدفع الآمنة لإتمام عملية الدفع.
                        </p>

                    </div>

                </div>

                <!-- Submit -->
                <button type="submit"
                        id="checkoutSubmitButton"
                        class="w-full py-3.5 rounded-xl gold-bg-gradient text-slate-950 font-extrabold transition flex items-center justify-center gap-2">

                    <i class="fa-solid fa-lock"></i>
                    متابعة إلى الدفع بالفيزا / Mastercard

                </button>

                <button type="button"
                        onclick="closePaymentModal()"
                        class="w-full py-2 text-slate-400 hover:text-white text-sm">

                    إلغاء

                </button>

                <p id="paymentSetupNotice"
                   class="text-[11px] text-amber-300/80 text-center"></p>

            </form>

        </div>

    </div>
</div>
