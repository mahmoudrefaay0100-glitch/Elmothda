
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">
    <title>تفاصيل المنتج | المتحدة للرتان والأثاث</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
        }

        .gold { color: #D4AF37; }
        .wine { background: #8B1E2B; }
        .amber { background: #E87A18; color: #111; }

        .product-thumb {
            width: 85px;
            height: 85px;
            flex: 0 0 auto;
        }

        #customizer-overlay {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: #111;
        }

        #customizer-overlay iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        #customizer-overlay-close {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 2147483647;
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            background: #8B1E2B;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header class="border-b border-neutral-800 p-4">
        <a href="/" class="font-bold text-lg">المتحدة للرتان والأثاث</a>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8">
        <a href="/"
           class="inline-flex items-center gap-2 rounded-xl border border-neutral-700 bg-neutral-900 px-5 py-3 text-sm font-bold text-white hover:border-amber-500 transition">
            <span>→</span>
            <span>العودة للمتجر</span>
        </a>

        <div id="product-details" class="mt-6 text-center text-gray-400">
            جارٍ تحميل بيانات المنتج...
        </div>
    </main>

    <script>
    let currentProductDetails = null;

    window.selectProductImage = function(index) {
        const product = currentProductDetails;

        if (!product || !Array.isArray(product.images)) return;

        const image = product.images[index];
        const mainImage = document.getElementById('product-main-image');
        const thumbnails = document.getElementById('product-image-thumbnails');

        if (!image || !mainImage || !thumbnails) return;

        mainImage.src = image;

        thumbnails.querySelectorAll('button').forEach((button, i) => {
            button.classList.toggle('border-amber-500', i === index);
            button.classList.toggle('border-neutral-700', i !== index);
            button.setAttribute('aria-pressed', String(i === index));
        });
    };

    // فتح نظام التخصيص الأصلي داخل نافذة فوق صفحة المنتج
    function openCustomizerOnProductPage(product) {
        if (!product || !product.id) {
            alert('تعذر تحديد المنتج. حدّث الصفحة وحاول مرة أخرى.');
            return;
        }

        if (document.getElementById('customizer-overlay')) return;

        const button = document.getElementById('customize-product');
        const originalButtonText = button.textContent;
        const oldOverflow = document.body.style.overflow;

        button.disabled = true;
        button.textContent = 'جاري فتح التخصيص...';

        const overlay = document.createElement('div');
        overlay.id = 'customizer-overlay';

        const frame = document.createElement('iframe');
        frame.title = 'تخصيص المنتج وإتمام الطلب';
        frame.src = '/';

        const closeButton = document.createElement('button');
        closeButton.id = 'customizer-overlay-close';
        closeButton.type = 'button';
        closeButton.textContent = '✕ إغلاق';

        let closed = false;
        let attempts = 0;
        let retryTimer = null;

        function closeOverlay() {
            if (closed) return;
            closed = true;

            if (retryTimer) clearTimeout(retryTimer);

            overlay.remove();
            document.body.style.overflow = oldOverflow;

            button.disabled = false;
            button.textContent = originalButtonText;
        }

        closeButton.addEventListener('click', closeOverlay);

        frame.addEventListener('load', () => {
            if (closed) return;

            try {
                const win = frame.contentWindow;
                const doc = frame.contentDocument;

                if (!win || !doc) {
                    throw new Error('تعذر الوصول إلى صفحة المتجر.');
                }

                // نقل النوافذ المطلوبة إلى body حتى تظهر فوق الصفحة
                [
                    'product-detail-modal',
                    'checkout-modal',
                    'cart-drawer'
                ].forEach(id => {
                    const element = doc.getElementById(id);

                    if (element && element.parentElement !== doc.body) {
                        doc.body.appendChild(element);
                    }
                });

                // إخفاء محتويات الصفحة الرئيسية مع الإبقاء على
                // التخصيص والسلة وإتمام الطلب
                if (!doc.getElementById('product-page-embed-style')) {
                    const style = doc.createElement('style');
                    style.id = 'product-page-embed-style';

                    style.textContent = `
                        html, body {
                            margin: 0 !important;
                            padding: 0 !important;
                            min-height: 100% !important;
                            background: #111 !important;
                            overflow: hidden !important;
                        }

                        body > * {
                            display: none !important;
                        }

                        body > #product-detail-modal,
                        body > #checkout-modal,
                        body > #cart-drawer {
                            display: flex !important;
                            position: fixed !important;
                            inset: 0 !important;
                            z-index: 2147483000 !important;
                        }

                        #product-detail-modal.hidden,
                        #checkout-modal.hidden,
                        #cart-drawer.hidden {
                            display: none !important;
                        }
                    `;

                    doc.head.appendChild(style);
                }

                // انتظار تحميل بيانات المتجر قبل فتح التخصيص
                function tryOpenCustomizer() {
                    if (closed) return;

                    attempts++;

                    try {
                        const targetId = JSON.stringify(String(product.id));

                        const ready = win.eval(`
                            typeof openCustomizerModal === 'function' &&
                            typeof appState !== 'undefined' &&
                            Array.isArray(appState.products) &&
                            appState.products.some(
                                p => String(p.id) === ${targetId}
                            )
                        `);

                        if (ready) {
                            win.openCustomizerModal(product.id);
                            frame.style.opacity = '1';
                            button.textContent = 'التخصيص مفتوح';
                            return;
                        }
                    } catch (error) {
                        console.error('CUSTOMIZER INIT:', error);
                        closeOverlay();
                        alert('تعذر تشغيل التخصيص. راجع أخطاء صفحة المتجر.');
                        return;
                    }

                    if (attempts >= 80) {
                        closeOverlay();
                        alert(
                            'لم يتم تحميل بيانات التخصيص في الوقت المحدد. ' +
                            'تأكد أن المنتجات ونظام التخصيص يعملان في صفحة المتجر.'
                        );
                        return;
                    }

                    retryTimer = setTimeout(tryOpenCustomizer, 250);
                }

                frame.style.opacity = '1';
                tryOpenCustomizer();

            } catch (error) {
                console.error('PRODUCT CUSTOMIZER ERROR:', error);
                closeOverlay();
                alert('تعذر فتح نافذة التخصيص. حاول مرة أخرى.');
            }
        });

        overlay.appendChild(frame);
        overlay.appendChild(closeButton);

        document.body.style.overflow = 'hidden';
        document.body.appendChild(overlay);
    }

    (async function() {
        const container = document.getElementById('product-details');
        const productId = new URLSearchParams(location.search).get('id');

        if (!productId) {
            container.textContent = 'لم يتم تحديد المنتج.';
            return;
        }

        try {
            const response = await fetch('/api/products', {
                cache: 'no-store'
            });

            const data = await response.json();

            if (!response.ok || !data.success || !Array.isArray(data.products)) {
                throw new Error('تعذر تحميل المنتجات.');
            }

            const item = data.products.find(
                p => String(p.id) === String(productId)
            );

            if (!item) {
                container.textContent = 'المنتج غير موجود أو لم يعد متاحًا.';
                return;
            }

            const productImages = Array.isArray(item.images)
                ? item.images.filter(
                    image => typeof image === 'string' && image.trim()
                )
                : [];

            const legacyImage = item.image_url || item.imageUrl || '';

            if (!productImages.length && legacyImage) {
                productImages.push(legacyImage);
            }

            const product = {
                id: item.id,
                title: item.name || item.title || '',
                category: item.category || '',
                price: Number(item.price) || 0,
                images: productImages,
                image: productImages[0] || 'https://placehold.co/700x500',
                description: item.description || '',
                dimensions: item.dimensions || '',
                specifications: item.specifications || ''
            };

            currentProductDetails = product;

            const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[ch]);

            container.className = 'mt-6';

            container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8 items-start text-right">

                    <div>
                        <div class="rounded-2xl overflow-hidden border border-neutral-800 bg-neutral-900">
                            <img
                                id="product-main-image"
                                src="${safe(product.image)}"
                                alt="${safe(product.title)}"
                                class="w-full object-cover cursor-zoom-in"
                                style="max-height:600px"
                                title="اضغط لعرض الصورة بالحجم الكامل"
                            >
                        </div>

                        ${product.images.length ? `
                            <div id="product-image-thumbnails"
                                 class="flex flex-wrap gap-3 mt-4 justify-start">
                                ${product.images.map((image, index) => `
                                    <button
                                        type="button"
                                        class="product-thumb overflow-hidden rounded-xl border-2 ${index === 0 ? 'border-amber-500' : 'border-neutral-700'}"
                                        onclick="selectProductImage(${index})"
                                        aria-label="عرض الصورة ${index + 1}"
                                        aria-pressed="${index === 0}"
                                    >
                                        <img
                                            src="${safe(image)}"
                                            alt="${safe(product.title)} - ${index + 1}"
                                            loading="lazy"
                                            class="w-full h-full object-cover"
                                        >
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>

                    <section class="space-y-5">
                        <p class="text-sm gold">${safe(product.category)}</p>

                        <h1 class="text-2xl md:text-3xl font-bold">
                            ${safe(product.title)}
                        </h1>

                        <p class="text-2xl font-extrabold gold">
                            ${product.price.toLocaleString('en-US')} ج.م
                        </p>

                        ${product.description ? `
                            <div>
                                <h2 class="font-bold mb-2">وصف المنتج</h2>
                                <p class="text-gray-300 leading-8 whitespace-pre-line">${safe(product.description)}</p>
                            </div>
                        ` : ''}

                        ${product.dimensions ? `
                            <div>
                                <h2 class="font-bold mb-2">المقاسات</h2>
                                <p class="text-gray-300">${safe(product.dimensions)}</p>
                            </div>
                        ` : ''}

                        ${product.specifications ? `
                            <div>
                                <h2 class="font-bold mb-2">المواصفات</h2>
                                <p class="text-gray-300 leading-8 whitespace-pre-line">${safe(product.specifications)}</p>
                            </div>
                        ` : ''}

                        <button
                            id="customize-product"
                            type="button"
                            class="amber w-full rounded-xl p-4 font-extrabold"
                        >
                            تخصيص وإضافة للسلة
                        </button>

                        <p class="text-xs text-gray-500">
                            اختر التنجيد والألوان والكمية، ثم أضف المنتج للسلة وأكمل طلبك.
                        </p>
                    </section>
                </div>
            `;

            document.getElementById('product-main-image')
                .addEventListener('click', () => {
                    window.open(
                        document.getElementById('product-main-image').src,
                        '_blank',
                        'noopener,noreferrer'
                    );
                });

            document.getElementById('customize-product')
                .addEventListener('click', () => {
                    openCustomizerOnProductPage(product);
                });

            const otherProducts = data.products.filter(
                p =>
                    String(p.id) !== String(product.id) &&
                    p.visible !== false &&
                    p.is_active !== false
            );

            if (otherProducts.length) {
                container.insertAdjacentHTML('beforeend', `
                    <section class="mt-14 border-t border-neutral-800 pt-8">
                        <div class="mb-6">
                            <h2 class="text-2xl font-extrabold text-white">
                                اكتشف باقي منتجاتنا
                            </h2>
                            <p class="mt-2 text-sm text-gray-400">
                                اختار من تشكيلتنا المتنوعة من أثاث الرتان والأثاث الخارجي
                            </p>
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            ${otherProducts.map(p => {
                                const otherImages = Array.isArray(p.images)
                                    ? p.images.filter(
                                        image => typeof image === 'string' && image.trim()
                                    )
                                    : [];

                                const otherImage =
                                    otherImages[0] ||
                                    p.image_url ||
                                    p.imageUrl ||
                                    'https://placehold.co/400';

                                const otherTitle = p.name || p.title || 'منتج من المتحدة';
                                const otherPrice = Number(p.price) || 0;

                                return `
                                    <a
                                        href="/product.html?id=${encodeURIComponent(p.id)}"
                                        class="block overflow-hidden rounded-2xl border border-neutral-800 bg-neutral-900 hover:border-amber-500 transition"
                                    >
                                        <div class="h-36 sm:h-48 overflow-hidden bg-neutral-950">
                                            <img
                                                src="${safe(otherImage)}"
                                                alt="${safe(otherTitle)}"
                                                loading="lazy"
                                                class="h-full w-full object-cover hover:scale-105 transition duration-300"
                                            >
                                        </div>

                                        <div class="p-3">
                                            <h3 class="text-sm font-bold text-white">
                                                ${safe(otherTitle)}
                                            </h3>

                                            <p class="mt-2 font-extrabold gold">
                                                ${otherPrice.toLocaleString('en-US')} ج.م
                                            </p>

                                            <span class="mt-3 block rounded-lg amber py-2 text-center text-xs font-bold">
                                                عرض التفاصيل
                                            </span>
                                        </div>
                                    </a>
                                `;
                            }).join('')}
                        </div>
                    </section>
                `);
            }

            document.title = product.title + ' | المتحدة للرتان والأثاث';

        } catch (error) {
            console.error('PRODUCT PAGE ERROR:', error);
            container.textContent =
                'حدث خطأ أثناء تحميل المنتج. حاول تحديث الصفحة.';
        }
    })();
    </script>
</body>
</html>
